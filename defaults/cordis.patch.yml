- id: agent-default-model
  config:
    provider: atelier-openai
    model: YOUR_MODEL_ID
- id: agent-presets
  config:
    default: vitruvius
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: llm-deepseek
  disabled: true
# Web search goes to the user's own SearXNG (Settings > Model roles > Web search, or ATELIER_SEARCH_URL). The base
# bundle pins DeepSeek's hosted search, which needs a DeepSeek key and would answer every search with a key error.
- id: web
  config:
    searchProvider: atelier-searxng
    fetchProvider: http
- id: web-search-deepseek
  disabled: true
- id: ui-brand-official
  disabled: true
- insert:
    - id: atelier-canvas
      name: '@arcitech/atelier-canvas'
    # Model roles: one endpoint per job (brain, vision, speech, embeddings, images, helper) and "Set me up".
    - id: atelier-roles
      name: '@arcitech/atelier-roles'
    # Local source-backed notes that persist across chats on this installation.
    - id: atelier-knowledge
      name: '@arcitech/atelier-knowledge'
    - id: atelier-start
      name: '@arcitech/atelier-start'
    # Mission Control for this computer: tokens, graphics card use, energy cost at your price, and which model is loaded now.
    - id: atelier-mission
      name: '@arcitech/atelier-mission'
    # Brains (Settings > General): what is loaded now on this computer's graphics card, with Load, Unload and Reload.
    # What may be started or stopped is listed in brains.json (see docs/brains.md); the browser can not send commands.
    - id: atelier-brains
      name: '@arcitech/atelier-brains'

- insert:
    - id: atelier-workspace-profiles
      name: "@arcitech/atelier-workspace-profiles"
