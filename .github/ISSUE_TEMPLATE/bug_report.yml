name: Bug report
description: Something in Atelier broke or behaved unexpectedly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Please never paste API keys, tokens, login addresses or client material.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw, including the exact error message if there was one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click or type, in order?
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - WSL2 (Ubuntu on Windows)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and memory
      description: For example NVIDIA RTX 4070 12 GB, Intel Arc B580 12 GB, or "none".
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Model route
      description: Where does your model run?
      options:
        - Free cloud
        - Paid cloud
        - Local
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and server (optional)
      description: For example Qwen3-VL on LM Studio, or a free tier through OmniRoute.
  - type: input
    id: version
    attributes:
      label: Atelier version
      description: Settings > Updates shows it. Example 0.1.0-preview.
    validations:
      required: true
