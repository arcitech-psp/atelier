# Atelier "Cloud" profile (ATELIER_PROFILE=cloud): same plugins as the default profile, cloud brain by default.
- id: agent-default-model
  config:
    provider: omniroute-cloud
    model: combo/atelier-brain
- id: agent-presets
  config:
    default: vitruvius
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: llm-deepseek
  disabled: true
- id: ui-brand-official
  disabled: true
- insert:
    - id: atelier-canvas
      name: '@arcitech/atelier-canvas'
    # Model roles: one endpoint per job (brain, vision, speech, embeddings, images, helper) and "Set me up".
    - id: atelier-roles
      name: '@arcitech/atelier-roles'
    - id: atelier-start
      name: '@arcitech/atelier-start'
    # Mission Control for this computer: tokens, graphics card use, energy cost at your price, and which model is loaded now.
    - id: atelier-mission
      name: '@arcitech/atelier-mission'
